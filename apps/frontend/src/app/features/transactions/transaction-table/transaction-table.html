<div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort>

        <!-- CATEGORY -->
        <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Category
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.category }}
            </td>
        </ng-container>

        <!-- SUBCATEGORY -->
        <ng-container matColumnDef="subcategory">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Subcategory
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.subcategory }}
            </td>
        </ng-container>

        <!-- DATE -->
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Date
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.date }}
            </td>
        </ng-container>

        <!-- ACCOUNT -->
        <ng-container matColumnDef="account">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Account
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.account }}
            </td>
        </ng-container>

        <!-- CURRENCY -->
        <ng-container matColumnDef="currency">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Currency
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.currency }}
            </td>
        </ng-container>

        <!-- AMOUNT -->
        <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Amount
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.amount }}
            </td>
        </ng-container>

        <!-- DESCRIPTION -->
        <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Description
            </th>
            <td mat-cell *matCellDef="let row">
                {{ row.description }}
            </td>
        </ng-container>

        <!-- ACTION -->
        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>
                Action
            </th>
            <td mat-cell *matCellDef="let row">
                <div class="action-buttons">
                    <button mat-icon-button (click)="editTransaction(row)">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="deleteTransaction(row)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </td>
        </ng-container>

        <!-- HEADER -->
        <tr mat-header-row *matHeaderRowDef="getDisplayedColumns(); sticky: true"></tr>

        <!-- FILTER ROW -->
        <tr class="filter-row">
            @for (column of getDisplayedColumns(); track column) {
            <td>
                @if (column !== 'action') {
                <mat-form-field appearance="outline" class="filter-field">
                    <input matInput [(ngModel)]="columnFilters[column]" (keyup)="applyColumnFilter()"
                        placeholder="Search" />
                </mat-form-field>
                }
            </td>
            }
        </tr>

        <!-- DATA ROWS -->
        <tr mat-row *matRowDef="
                let row;
                columns: getDisplayedColumns()
            "></tr>
    </table>

    <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons>
    </mat-paginator>
</div>
