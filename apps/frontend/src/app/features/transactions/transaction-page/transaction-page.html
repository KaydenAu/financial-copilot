<div class="transaction-page">
    <!-- TOOLBAR -->
    <section class="transaction-page__toolbar">
        <mat-form-field appearance="outline" floatLabel="always" class="transaction-page__search">
            <mat-label>Search Transactions</mat-label>
            <input matInput [(ngModel)]="searchKeyword" placeholder="Search..." (keyup)="refreshData()" />
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="transaction-page__actions">
            <button mat-raised-button type="button" class="transaction-page__button" (click)="refreshData()">
                <mat-icon>refresh</mat-icon>
                Refresh
            </button>

            <button mat-raised-button type="button" class="transaction-page__button" (click)="addTransaction()">
                <mat-icon>add</mat-icon>
                Add Transaction
            </button>

            <button mat-raised-button type="button" class="transaction-page__button" (click)="downloadExcel()">
                <mat-icon>download</mat-icon>
                Download Excel
            </button>

            <button mat-icon-button [matMenuTriggerFor]="columnMenu" class="transaction-page__menu-trigger">
                <mat-icon>view_column</mat-icon>
            </button>

            <mat-menu #columnMenu="matMenu" class="transaction-page__menu-panel">
                @for (column of displayedColumns; track column) {
                <button mat-menu-item class="transaction-page__menu-item" (click)="toggleColumn(column)">
                    <mat-icon>
                        {{ visibleColumns[column] ? 'check_box' : 'check_box_outline_blank' }}
                    </mat-icon>
                    <span>{{ column | titlecase }}</span>
                </button>
                }
            </mat-menu>

        </div>
    </section>

    <!-- TABLE -->
    <section class="transaction-page__table-section">
        <app-transaction-table [transactions]="transactions" [visibleColumns]="visibleColumns"
            (edit)="editTransaction($event)" (delete)="deleteTransaction($event)">
        </app-transaction-table>
    </section>
</div>
